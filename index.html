        const formatFysText = (fys) => {
            if (!fys || fys.length === 0) return "ไม่มีข้อมูลที่เลือก";
            const shortYears = fys.map(y => y.slice(-2)).sort((a, b) => parseInt(a) - parseInt(b));
            if (shortYears.length === 1) {
                return `ปีงบ ${shortYears[0]}`;
            }
            if (shortYears.length === 2) {
                return `ปีงบ ${shortYears[0]} และ ${shortYears[1]}`;
            }
            const initial = shortYears.slice(0, -1).join(", ");
            const last = shortYears[shortYears.length - 1];
            return `ปีงบ ${initial} และ ${last}`;
        };

        function parseGvizDate(str) {
            if (!str) return "";
            const match = str.match(/Date\((\d+),(\d+),(\d+)\)/);
            if (match) {
                const year = parseInt(match[1]);
                const monthIdx = parseInt(match[2]);
                const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
                const thaiMonth = thaiMonths[monthIdx] || "ตุลาคม";
                const thaiYear = year + 543;
                return `${thaiMonth} ${thaiYear}`;
            }
            return str;
        }

        function getComputedFiscalYear(monthStr) {
            if (!monthStr) return "2567";
            const cleanStr = monthStr.replace(/\s+/g, ' ').trim();
            const parts = cleanStr.split(' ');
            if (parts.length < 2) return "2567";
            
            const monthName = parts[0].toLowerCase();
            let yearVal = parseInt(parts[1]);
            if (isNaN(yearVal)) return "2567";
            
            if (yearVal < 2400) {
                yearVal += 543;
            }
            
            const isNextFy = ["ตุลาคม", "พฤศจิกายน", "ธันวาคม", "oct", "nov", "dec"].some(m => monthName.includes(m));
            if (isNextFy) {
                return String(yearVal + 1);
            }
            return String(yearVal);
        }

            const chartInstance = useRef(null);

            const getCellString = (row, colIdx) => {
                if (!row || !row.c || colIdx < 0 || colIdx >= row.c.length) return "";
                const cell = row.c[colIdx];
                if (!cell) return "";
                if (cell.f !== null && cell.f !== undefined) return String(cell.f).trim();
                if (cell.v !== null && cell.v !== undefined) return String(cell.v).trim();
                return "";
            };

            const getCellNum = (row, colIdx) => {
                if (!row || !row.c || colIdx < 0 || colIdx >= row.c.length) return 0;
                const cell = row.c[colIdx];
                if (!cell) return 0;

                if (cell.v !== null && cell.v !== undefined) {
                    if (typeof cell.v === 'number') return cell.v;
                    const clean = String(cell.v).replace(/,/g, '').trim();
                    const parsed = parseFloat(clean);
                    if (!isNaN(parsed)) return parsed;
                }
                if (cell.f !== null && cell.f !== undefined) {
                    const clean = String(cell.f).replace(/,/g, '').trim();
                    const parsed = parseFloat(clean);
                    if (!isNaN(parsed)) return parsed;
                }
                return 0;
            };

            const syncGoogleSheetData = async (silent = false) => {
                if (!silent) setIsLoading(true);
                const sheetId = '13iq2hGdH0h0LaISywv7XJjXKXOBYzddiixk2X8aaewk';
                
                try {
                    // 1. Fetch Follower Tab
                    const followerUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=Follower`;
                    const followerRes = await fetch(followerUrl);
                    if (followerRes.ok) {
                        const text = await followerRes.text();
                        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\W\D]*)\);/);
                        if (match) {
                            const obj = JSON.parse(match[1]);
                            if (obj.table && obj.table.rows) processFollowers(obj.table.rows);
                        }
                    }

                    // 2. Fetch Reach Tab
                    const reachUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=Reach`;
                    const reachRes = await fetch(reachUrl);
                    if (reachRes.ok) {
                        const text = await reachRes.text();
                        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\W\D]*)\);/);
                        if (match) {
                            const obj = JSON.parse(match[1]);
                            if (obj.table && obj.table.rows) processReach(obj.table.rows);
                        }
                    }

                    // 3. Fetch Gender Tab
                    const genderUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=Gender`;
                    const genderRes = await fetch(genderUrl);
                    if (genderRes.ok) {
                        const text = await genderRes.text();
                        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\W\D]*)\);/);
                        if (match) {
                            const obj = JSON.parse(match[1]);
                            if (obj.table && obj.table.rows) setGenderRawRows(obj.table.rows);
                        }
                    }

                    // 4. Fetch Age Tab
                    const ageUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=Age`;
                    const ageRes = await fetch(ageUrl);
                    if (ageRes.ok) {
                        const text = await ageRes.text();
                        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\W\D]*)\);/);
                        if (match) {
                            const obj = JSON.parse(match[1]);
                            if (obj.table && obj.table.rows) setAgeRawRows(obj.table.rows);
                        }
                    }

                    // 5. Fetch Province/District Tab
                    const provinceUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=Province%2FDistrict`;
                    const provinceRes = await fetch(provinceUrl);
                    if (provinceRes.ok) {
                        const text = await provinceRes.text();
                        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\W\D]*)\);/);
                        if (match) {
                            const obj = JSON.parse(match[1]);
                            if (obj.table && obj.table.rows) setProvinceRawRows(obj.table.rows);
                        }
                    }

                    // 6. Fetch Country Tab
                    const countryUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=Country`;
                    const countryRes = await fetch(countryUrl);
                    if (countryRes.ok) {
                        const text = await countryRes.text();
                        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\W\D]*)\);/);
                        if (match) {
                            const obj = JSON.parse(match[1]);
                            if (obj.table && obj.table.rows) setCountryRawRows(obj.table.rows);
                        }
                    }

                    if (!silent) showToast("ซิงค์ข้อมูลจากทุก Tab สำเร็จ!");
                } catch (error) {
                    console.warn("Live update failed, falling back to cached datasets.", error);
                    if (!silent) showToast("ระบบดึงข้อมูลออฟไลน์มาแสดงผลชั่วคราว");
                } finally {
                    setIsLoading(false);
                }
            };

            const processFollowers = (rows) => {
                let headerRowIdx = 0;
                let maxMatches = -1;
                for (let r = 0; r < Math.min(rows.length, 15); r++) {
                    const row = rows[r];
                    if (!row || !row.c) continue;
                    let matches = 0;
                    for (let c = 0; c < Math.min(row.c.length, 10); c++) {
                        const val = getCellString(row, c).toLowerCase();
                        if (val.includes("เดือน") || val.includes("facebook") || val.includes("instagram") || val.includes("tiktok") || val.includes("line")) {
                            matches++;
                        }
                    }
                    if (matches > maxMatches) {
                        maxMatches = matches;
                        headerRowIdx = r;
                    }
                }

                const headerRow = rows[headerRowIdx];
                let colMap = { month: 0, fb_rprp: 1, ig: 3, tiktok: 4, line_net: 6, note: 8 };

                if (headerRow && headerRow.c) {
                    for (let c = 0; c < Math.min(headerRow.c.length, 10); c++) {
                        const val = getCellString(headerRow, c).toLowerCase();
                        if (val.includes("เดือน") || val.includes("month") || val.includes("date")) {
                            colMap.month = c;
                        } else if (val.includes("facebook rprp") || (val.includes("facebook") && !val.includes("school") && !val.includes("page"))) {
                            colMap.fb_rprp = c;
                        } else if (val.includes("instagram") || val.includes("ig")) {
                            colMap.ig = c;
                        } else if (val.includes("tiktok") || val.includes("tik tok")) {
                            colMap.tiktok = c;
                        } else if (val.includes("line") && (val.includes("ไม่รวม") || val.includes("net") || val.includes("unblocked") || val.includes("friend") || val.includes("active") || val.includes("oa"))) {
                            colMap.line_net = c;
                        } else if (val.includes("หมายเหตุ") || val.includes("note")) {
                            colMap.note = c;
                        }
                    }
                }

                const dataRows = rows.slice(headerRowIdx + 1);
                const parsed = dataRows.map((row, idx) => {
                    if (!row || !row.c) return null;
                    let month = getCellString(row, colMap.month);
                    if (!month || month === "") return null;
                    if (month.startsWith("Date(")) {
                        const converted = parseGvizDate(month);
                        if (converted) month = converted;
                    }
                    if (month.includes("ปีงบ") || month.includes("รวม") || month.includes("เฉลี่ย")) return null;

                    const fy = getComputedFiscalYear(month);
                    let fb_rprp = getCellNum(row, colMap.fb_rprp);
                    let ig = getCellNum(row, colMap.ig);
                    let tiktok = getCellNum(row, colMap.tiktok);
                    let line_net = getCellNum(row, colMap.line_net);
                    const note = getCellString(row, colMap.note);

                    const fallbackRow = fallbackFollowerData.find(f => f.month.trim().replace(/\s+/g, ' ') === month.trim().replace(/\s+/g, ' '));
                    if (fallbackRow) {
                        if (fb_rprp === 0 && fallbackRow.fb_rprp > 0) fb_rprp = fallbackRow.fb_rprp;
                        if (ig === 0 && fallbackRow.ig > 0) ig = fallbackRow.ig;
                        if (tiktok === 0 && fallbackRow.tiktok > 0) tiktok = fallbackRow.tiktok;
                        if (line_net === 0 && fallbackRow.line_net > 0) line_net = fallbackRow.line_net;
                    }

                    return {
                        id: idx + 1,
                        month: month,
                        fy: fy,
                        fb_rprp: fb_rprp,
                        ig: ig,
                        tiktok: tiktok,
                        line_net: line_net,
                        note: note || (fallbackRow ? fallbackRow.note : "")
                    };
                }).filter(item => item !== null && (item.fb_rprp > 0 || item.line_net > 0 || item.tiktok > 0 || item.ig > 0));

                if (parsed.length > 0) setFollowerData(parsed);
            };

            const processReach = (rows) => {
                let headerRowIdx = 0;
                const dataRows = rows.slice(headerRowIdx + 1);
                
                const parsed = dataRows.map((row, idx) => {
                    if (!row || !row.c) return null;
                    let month = getCellString(row, 0);
                    if (!month) return null;
                    if (month.startsWith("Date(")) {
                        const converted = parseGvizDate(month);
                        if (converted) month = converted;
                    }
                    if (month.includes("รวม") || month.includes("เฉลี่ย")) return null;

                    const fy = getComputedFiscalYear(month);
                    
                    // ดึงข้อมูลจาก Google Sheets ตามจริง
                    let fb_reach = getCellNum(row, 3) || 0; 
                    let ig_reach = getCellNum(row, 7) || 0; 
                    let tiktok_views = getCellNum(row, 8) || 0; 

                    // นำเงื่อนไขการตรวจสอบ Fallback ออกเพื่อให้แสดงข้อมูลตามที่คุณกรอกใน Google Sheets เท่านั้น
                    return {
                        id: idx + 1,
                        month: month,
                        fy: fy,
                        fb_reach: fb_reach,
                        ig_reach: ig_reach,
                        tiktok_views: tiktok_views
                    };
                }).filter(item => item !== null && (item.fb_reach > 0 || item.tiktok_views > 0 || item.ig_reach > 0));

                if (parsed.length > 0) setReachData(parsed);
            };

            // Dynamic Aggregator for Target Group based on Sub-Tabs and Filters
            const targetGroupDataFiltered = useMemo(() => {
                // 1. Process Gender Data from Gender Sheet
                let maleTotal = 0;
                let femaleTotal = 0;
                let genderCount = 0;

                // Column mappings based on standard multi-platform structure:
                // Col 0: Month, Col 1-2: FB RPRP (Male, Female), Col 3-4: IG, Col 5-6: TikTok, Col 7-8: LINE OA
                const platformGenderCols = {
                    fb_rprp: { male: 1, female: 2 },
                    ig: { male: 5, female: 6 },
                    tiktok: { male: 7, female: 8 },
                    line_net: { male: 9, female: 10 }
                };

                genderRawRows.forEach(row => {
                    let monthStr = getCellString(row, 0);
                    if (!monthStr || monthStr.includes("ปีงบ") || monthStr.includes("เดือน")) return;
                    if (monthStr.startsWith("Date(")) monthStr = parseGvizDate(monthStr);

                    const rowFy = getComputedFiscalYear(monthStr);
                    if (selectedTargetFy !== "all" && rowFy !== selectedTargetFy) return;
                    if (selectedTargetMonth !== "all" && !monthStr.includes(selectedTargetMonth)) return;

                    if (selectedTargetPlatform === "all") {
                        Object.values(platformGenderCols).forEach(cols => {
                            const m = getCellNum(row, cols.male);
                            const f = getCellNum(row, cols.female);
                            if (m > 0 || f > 0) {
                                maleTotal += m;
                                femaleTotal += f;
                                genderCount++;
                            }
                        });
                    } else {
                        const cols = platformGenderCols[selectedTargetPlatform];
                        if (cols) {
                            const m = getCellNum(row, cols.male);
                            const f = getCellNum(row, cols.female);
                            if (m > 0 || f > 0) {
                                maleTotal += m;
                                femaleTotal += f;
                                genderCount++;
                            }
                        }
                    }
                });

                let finalGender = [];
                if (genderCount > 0 && (maleTotal > 0 || femaleTotal > 0)) {
                    const sum = maleTotal + femaleTotal;
                    finalGender = [
                        { segment: "หญิง (Female)", value: Number(((femaleTotal / sum) * 100).toFixed(1)) },
                        { segment: "ชาย (Male)", value: Number(((maleTotal / sum) * 100).toFixed(1)) }
                    ];
                } else {
                    finalGender = fallbackTargetGroupTabs.gender;
                }

                // 2. Process Age Data from Age Sheet
                // Col 0: Month, Col 1: FB RPRP, Col 2: IG, Col 3: TikTok, Col 4: LINE OA (or similar)
                const ageCounts = {};
                const platformAgeCols = { fb_rprp: 1, ig: 3, tiktok: 4, line_net: 5 };

                ageRawRows.forEach(row => {
                    let monthStr = getCellString(row, 0);
                    if (!monthStr || monthStr.includes("ปีงบ") || monthStr.includes("เดือน")) return;
                    if (monthStr.startsWith("Date(")) monthStr = parseGvizDate(monthStr);

                    const rowFy = getComputedFiscalYear(monthStr);
                    if (selectedTargetFy !== "all" && rowFy !== selectedTargetFy) return;
                    if (selectedTargetMonth !== "all" && !monthStr.includes(selectedTargetMonth)) return;

                    const extractAgeBracket = (colIdx) => {
                        const val = getCellString(row, colIdx);
                        if (val && val.length > 2) {
                            ageCounts[val] = (ageCounts[val] || 0) + 1;
                        }
                    };

                    if (selectedTargetPlatform === "all") {
                        Object.values(platformAgeCols).forEach(colIdx => extractAgeBracket(colIdx));
                    } else {
                        const colIdx = platformAgeCols[selectedTargetPlatform];
                        if (colIdx !== undefined) extractAgeBracket(colIdx);
                    }
                });

                let finalAges = [];
                const totalAgeRecords = Object.values(ageCounts).reduce((a, b) => a + b, 0);
                if (totalAgeRecords > 0) {
                    finalAges = Object.entries(ageCounts).map(([bracket, count]) => ({
                        bracket: bracket,
                        percentage: Number(((count / totalAgeRecords) * 100).toFixed(1))
                    })).sort((a, b) => b.percentage - a.percentage);
                } else {
                    finalAges = fallbackTargetGroupTabs.ageBrackets;
                }

                // 3. Process Province/District Data
                const provinceCounts = {};
                provinceRawRows.forEach(row => {
                    const name = getCellString(row, 0);
                    const val = getCellNum(row, 1);
                    if (name && val > 0) {
                        provinceCounts[name] = (provinceCounts[name] || 0) + val;
                    }
                });

                let finalRegions = [];
                const totalProvinceVal = Object.values(provinceCounts).reduce((a, b) => a + b, 0);
                if (totalProvinceVal > 0) {
                    finalRegions = Object.entries(provinceCounts).map(([name, val]) => ({
                        name: name,
                        percentage: Number(((val / totalProvinceVal) * 100).toFixed(1))
                    })).sort((a, b) => b.percentage - a.percentage).slice(0, 4);
                } else {
                    finalRegions = fallbackTargetGroupTabs.regions;
                }

                // 4. Process Country Data
                const countryCounts = {};
                countryRawRows.forEach(row => {
                    const name = getCellString(row, 0);
                    const val = getCellNum(row, 1);
                    if (name && val > 0) {
                        countryCounts[name] = (countryCounts[name] || 0) + val;
                    }
                });

                let finalCountries = [];
                const totalCountryVal = Object.values(countryCounts).reduce((a, b) => a + b, 0);
                if (totalCountryVal > 0) {
                    finalCountries = Object.entries(countryCounts).map(([name, val]) => ({
                        name: name,
                        percentage: Number(((val / totalCountryVal) * 100).toFixed(1))
                    })).sort((a, b) => b.percentage - a.percentage);
                } else {
                    finalCountries = fallbackTargetGroupTabs.countries;
                }

                return {
                    gender: finalGender,
                    ageBrackets: finalAges,
                    regions: finalRegions,
                    countries: finalCountries
                };
            }, [genderRawRows, ageRawRows, provinceRawRows, countryRawRows, selectedTargetFy, selectedTargetMonth, selectedTargetPlatform]);

            useEffect(() => {
                syncGoogleSheetData(true);
            }, []);

            const availableMonths = useMemo(() => {
                const activeSet = activeTab === "reach" ? reachData : followerData;
                return activeSet
                    .filter(d => selectedFys.includes(d.fy))
                    .map(d => d.month);
            }, [selectedFys, followerData, reachData, activeTab]);

            const filteredTimelineData = useMemo(() => {
                const activeSet = activeTab === "reach" ? reachData : followerData;
                let subset = activeSet.filter(d => selectedFys.includes(d.fy));

                if (startMonth !== "ทั้งหมด") {
                    const startIndex = subset.findIndex(d => d.month === startMonth);
                    if (startIndex !== -1) {
                        subset = subset.slice(startIndex);
                    }
                }
                if (endMonth !== "ทั้งหมด") {
                    const endIndex = subset.findIndex(d => d.month === endMonth);
                    if (endIndex !== -1) {
                        subset = subset.slice(0, endIndex + 1);
                    }
                }
                return subset;
            }, [selectedFys, startMonth, endMonth, followerData, reachData, activeTab]);

            const stats = useMemo(() => {
                const data = filteredTimelineData;
                if (data.length === 0) return {};

                const calcPlatformStat = (key) => {
                    const validPoints = data.filter(d => d[key] > 0);
                    if (validPoints.length === 0) return { current: 0, growth: 0, growthPct: 0 };
                    
                    const latest = validPoints[validPoints.length - 1][key];
                    const earliest = validPoints[0][key];
                    const diff = latest - earliest;
                    const pct = earliest > 0 ? ((diff / earliest) * 100).toFixed(1) : 0;

                    return { current: latest, growth: diff, growthPct: pct };
                };

                if (activeTab === "reach") {
                    return {
                        fb_reach: calcPlatformStat('fb_reach'),
                        ig_reach: calcPlatformStat('ig_reach'),
                        tiktok_views: calcPlatformStat('tiktok_views')
                    };
                } else {
                    return {
                        fb_rprp: calcPlatformStat('fb_rprp'),
                        ig: calcPlatformStat('ig'),
                        tiktok: calcPlatformStat('tiktok'),
                        line_net: calcPlatformStat('line_net')
                    };
                }
            }, [filteredTimelineData, activeTab]);

            const overallTotals = useMemo(() => {
                const data = filteredTimelineData;
                if (data.length === 0) return { latestTotal: 0, change: 0, pctChange: 0 };
                const latest = data[data.length - 1];
                const earliest = data[0];

                let sumLatest = 0, sumEarliest = 0;
                if (activeTab === "reach") {
                    sumLatest = (latest.fb_reach || 0) + (latest.ig_reach || 0) + (latest.tiktok_views || 0);
                    sumEarliest = (earliest.fb_reach || 0) + (earliest.ig_reach || 0) + (earliest.tiktok_views || 0);
                } else {
                    sumLatest = (latest.fb_rprp || 0) + (latest.ig || 0) + (latest.tiktok || 0) + (latest.line_net || 0);
                    sumEarliest = (earliest.fb_rprp || 0) + (earliest.ig || 0) + (earliest.tiktok || 0) + (earliest.line_net || 0);
                }

                return {
                    latestTotal: sumLatest,
                    change: sumLatest - sumEarliest,
                    pctChange: sumEarliest > 0 ? (((sumLatest - sumEarliest) / sumEarliest) * 100).toFixed(1) : 0
                };
            }, [filteredTimelineData, activeTab]);

            useEffect(() => {
                if (!chartRef.current) return;

                const ctx = chartRef.current.getContext('2d');
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                let chartData = { labels: [], datasets: [] };
                let options = {};

                if (activeTab === "follower") {
                    if (chartMode === "timeline") {
                        const labels = filteredTimelineData.map(d => d.month);
                        const datasets = selectedPlatforms.map(platformKey => {
                            const info = platforms[platformKey];
                            const dataPoints = filteredTimelineData.map(d => d[platformKey] || null);
                            return {
                                label: info.label,
                                data: dataPoints,
                                borderColor: info.color,
                                backgroundColor: info.color + '1A',
                                borderWidth: 3,
                                pointBackgroundColor: info.color,
                                pointBorderColor: '#fff',
                                pointRadius: labels.length > 20 ? 3 : 5,
                                tension: 0.35,
                                fill: false
                            };
                        });
                        chartData = { labels, datasets };
                        options = {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'top', labels: { font: { family: 'Sarabun' } } }
                            },
                            scales: {
                                y: { ticks: { callback: v => v.toLocaleString('th-TH') } }
                            }
                        };
                    } else {
                        chartData.labels = fiscalMonthsSequence;
                        chartData.datasets = selectedFys.map(fy => {
                            const style = fyColors[fy] || { border: "#94A3B8", bg: "#94A3B81A" };
                            const yearDataPoints = fiscalMonthsSequence.map(monthName => {
                                const found = followerData.find(d => d.fy === fy && d.month.startsWith(monthName));
                                if (!found) return null;
                                return found[comparisonPlatform] || null;
                            });
                            return {
                                label: `ปีงบประมาณ ${fy}`,
                                data: yearDataPoints,
                                borderColor: style.border,
                                backgroundColor: style.bg,
                                borderWidth: 3,
                                pointRadius: 5,
                                tension: 0.35,
                                fill: true
                            };
                        });
                        options = {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'top', labels: { font: { family: 'Sarabun' } } }
                            },
                            scales: {
                                y: { ticks: { callback: v => v.toLocaleString('th-TH') } }
                            }
                        };
                    }
                } else if (activeTab === "reach") {
                    // Reach Tab Visualization for 3 platforms
                    const labels = filteredTimelineData.map(d => d.month);
                    chartData = {
                        labels,
                        datasets: [
                            {
                                label: 'Facebook Reach',
                                data: filteredTimelineData.map(d => d.fb_reach),
                                borderColor: '#1877F2',
                                backgroundColor: '#1877F21F',
                                borderWidth: 2.5,
                                tension: 0.35,
                                fill: true
                            },
                            {
                                label: 'Instagram Reach',
                                data: filteredTimelineData.map(d => d.ig_reach),
                                borderColor: '#E1306C',
                                backgroundColor: '#E1306C12',
                                borderWidth: 2.5,
                                tension: 0.35,
                                fill: true
                            },
                            {
                                label: 'TikTok Views',
                                data: filteredTimelineData.map(d => d.tiktok_views),
                                borderColor: '#010101',
                                backgroundColor: '#0101010A',
                                borderWidth: 2.5,
                                tension: 0.35,
                                fill: true
                            }
                        ]
                    };
                    options = {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top', labels: { font: { family: 'Sarabun' } } }
                        },
                        scales: {
                            y: { ticks: { callback: v => v.toLocaleString('th-TH') } }
                        }
                    };
                } else if (activeTab === "target") {
                    chartData = {
                        labels: targetGroupDataFiltered.ageBrackets.map(item => item.bracket),
                        datasets: [{
                            label: 'สัดส่วนช่วงอายุผู้ติดตาม (%)',
                            data: targetGroupDataFiltered.ageBrackets.map(item => item.percentage),
                            backgroundColor: [
                                '#F4D160', '#D4AC2B', '#EAF5EC', '#1E5128', '#113217', '#F95738'
                            ],
                            borderRadius: 8,
                            borderWidth: 1
                        }]
                    };
                    options = {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { max: 100, ticks: { callback: v => v + '%' } }
                        }
                    };
                }

                chartInstance.current = new Chart(ctx, {
                    type: activeTab === "target" ? 'bar' : 'line',
                    data: chartData,
                    options: options
                });

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };

                                                <strong>หมายเหตุ:</strong> ระบบ LINE OA ไม่แสดงยอด Reach ในแบบโซเชียลมีเดียทั่วไป (เช่น Facebook หรือ IG) เพราะเป็นการสื่อสารแบบ 1:1 และ LINE เน้นเรื่อง Privacy ดังนั้นจึงไม่ต้องใช้ตัววัดค่า Reach เพื่อเดาว่ามีคนเห็นหรือไม่
                                            </span>
                                        </div>
                                    </div>
                                </React.Fragment>
                            )}

                            {/* TAB 3: Target Group Demographics Dashboard */}
                            {activeTab === "target" && (
                                <React.Fragment>
                                    <div className="bg-white rounded-3xl p-4 border border-emerald-100 shadow-sm mb-4 flex flex-wrap gap-4 items-center">
                                        <div>
                                            <label className="text-[10px] font-bold text-gray-400 block mb-1">เลือกปีงบประมาณ</label>
                                            <select value={selectedTargetFy} onChange={(e) => setSelectedTargetFy(e.target.value)} className="bg-rajapruek-soft border rounded-lg px-3 py-1.5 text-xs">
                                                <option value="all">ทุกปีงบประมาณ</option>
                                                {fiscalYearsList.filter(y => y !== "2567").map(y => <option key={y} value={y}>ปีงบ {y}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-gray-400 block mb-1">เลือกเดือน</label>
                                            <select value={selectedTargetMonth} onChange={(e) => setSelectedTargetMonth(e.target.value)} className="bg-rajapruek-soft border rounded-lg px-3 py-1.5 text-xs">
                                                <option value="ทั้งหมด">ทุกเดือน</option>
                                                {fiscalMonthsSequence.map(m => <option key={m} value={m}>{m}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-gray-400 block mb-1">เลือกแพลตฟอร์ม</label>
                                            <select value={selectedTargetPlatform} onChange={(e) => setSelectedTargetPlatform(e.target.value)} className="bg-rajapruek-soft border rounded-lg px-3 py-1.5 text-xs">
                                                <option value="all">ทุกแพลตฟอร์มรวมกัน</option>
                                                {Object.entries(platforms).map(([k, p]) => <option key={k} value={k}>{p.label}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-white rounded-3xl p-6 border border-emerald-100 shadow-md botanical-glow">
                                            <h3 className="font-extrabold text-rajapruek-greendark text-base mb-2">สัดส่วนผู้ติดตามแยกตามกลุ่มช่วงอายุ (Age Tab)</h3>
                                            <div className="relative h-[280px]">
                                                <canvas ref={chartRef}></canvas>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-3xl p-6 border border-emerald-100 shadow-md botanical-glow flex flex-col justify-between">
                                            <div>
                                                <h3 className="font-extrabold text-rajapruek-greendark text-base mb-4">ข้อมูลเชิงลึกทางประชากรศาสตร์ (รวมจาก Tab ย่อย)</h3>
                                                <div className="space-y-4">
                                                    {/* เพศ */}
                                                    <div className="bg-rajapruek-greenlight/40 p-4 rounded-xl border border-emerald-100">
                                                        <h4 className="font-bold text-rajapruek-greendark text-xs mb-1.5">เพศ (Gender Tab)</h4>
                                                        <div className="flex justify-between text-xs font-semibold">
                                                            {targetGroupDataFiltered.gender.map(g => <span key={g.segment}>{g.segment}: {g.value}%</span>)}
                                                        </div>
                                                    </div>
                                                    
                                                    {/* ภูมิภาค */}
                                                    <div className="bg-rajapruek-greenlight/40 p-4 rounded-xl border border-emerald-100">
                                                        <h4 className="font-bold text-rajapruek-greendark text-xs mb-2">จังหวัด/ภูมิภาคยอดนิยม (Province/District Tab)</h4>
                                                        {targetGroupDataFiltered.regions.map((reg, i) => (
                                                            <div key={i} className="flex justify-between text-xs text-gray-700 py-1">
                                                                <span>{reg.name}</span>
                                                                <span className="font-bold">{reg.percentage}%</span>
                                                            </div>
                                                        ))}
                                                    </div>

                                                    {/* ประเทศ */}
                                                    <div className="bg-rajapruek-greenlight/40 p-4 rounded-xl border border-emerald-100">
                                                        <h4 className="font-bold text-rajapruek-greendark text-xs mb-2">ประเทศ (Country Tab)</h4>
                                                        {targetGroupDataFiltered.countries.map((c, i) => (
                                                            <div key={i} className="flex justify-between text-xs text-gray-700">
                                                                <span>{c.name}</span>
                                                                <span className="font-bold">{c.percentage}%</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </React.Fragment>
                            )}

                        </main>
                    </div>

                    {/* Database Section */}
                    {activeTab !== "target" && (
                        <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 w-full">
                            <div className="bg-white rounded-3xl border border-emerald-100 shadow-md botanical-glow overflow-hidden">
                                
                                <div className="p-6 bg-gradient-to-r from-rajapruek-greenlight/60 to-white border-b border-emerald-50 flex flex-col sm:flex-row items-center justify-between gap-4">
                                    <div className="flex items-center space-x-3">
                                        <div className="p-2 bg-rajapruek-green text-white rounded-xl">
                                            <i data-lucide="database" className="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-extrabold text-rajapruek-greendark text-lg">
                                                {activeTab === "reach" ? "ตารางข้อมูลการเข้าถึงรายเดือน (Reach Table)" : "ฐานข้อมูลรายเดือน (Follower Database)"}
                                            </h3>
                                        </div>
                                    </div>

                                    <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full sm:w-auto">
                                        <div className="relative flex-grow sm:flex-grow-0 sm:w-64">
                                            <input 
                                                type="text" 
                                                placeholder="ค้นหาเดือนหรือปีงบ..." 
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                                className="w-full bg-white border border-gray-200 text-gray-800 rounded-xl pl-9 pr-4 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-rajapruek-green transition duration-200"
                                            />
                                            <i data-lucide="search" className="w-4 h-4 text-gray-400 absolute left-3 top-2.5"></i>
                                        </div>

                                        <button 
                                            onClick={exportToCSV}
                                            className="bg-rajapruek-green hover:bg-rajapruek-greendark text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center justify-center space-x-2 transition duration-200 shadow-sm"
                                        >
                                            <i data-lucide="download" className="w-4 h-4"></i>
                                            <span>ส่งออกตารางปีที่เลือกเป็น CSV</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="overflow-x-auto custom-scrollbar">
                                    {activeTab === "reach" ? (
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-rajapruek-soft border-b border-gray-100 text-rajapruek-greendark text-[11px] font-bold uppercase tracking-wider">
                                                    <th className="py-3.5 px-4">เดือน</th>
                                                    <th className="py-3.5 px-4">ปีงบประมาณ</th>
                                                    <th className="py-3.5 px-4 text-right">Facebook Reach</th>
                                                    <th className="py-3.5 px-4 text-right">Instagram Reach</th>
                                                    <th className="py-3.5 px-4 text-right">TikTok Views</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-50 text-xs text-gray-700">
                                                {filteredTimelineData
                                                    .filter(row => row.month.includes(searchTerm) || row.fy.includes(searchTerm))
                                                    .map((row) => (
                                                        <tr key={row.id} className="hover:bg-rajapruek-greenlight/20 transition-colors">
                                                            <td className="py-3 px-4 font-bold text-gray-900">{row.month}</td>
                                                            <td className="py-3 px-4">
                                                                <span className="bg-rajapruek-greenlight text-rajapruek-green px-2.5 py-0.5 rounded-full font-semibold text-[10px]">
                                                                    ปีงบ {row.fy}
                                                                </span>
                                                            </td>
                                                            <td className="py-3 px-4 text-right font-medium">{row.fb_reach ? row.fb_reach.toLocaleString() : "-"}</td>
                                                            <td className="py-3 px-4 text-right font-medium text-pink-700">{row.ig_reach ? row.ig_reach.toLocaleString() : "-"}</td>
                                                            <td className="py-3 px-4 text-right font-medium text-gray-900">{row.tiktok_views ? row.tiktok_views.toLocaleString() : "-"}</td>
                                                        </tr>
                                                    ))}
                                            </tbody>
                                        </table>
                                    ) : (
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-rajapruek-soft border-b border-gray-100 text-rajapruek-greendark text-[11px] font-bold uppercase tracking-wider">
                                                    <th className="py-3.5 px-4">เดือน</th>
                                                    <th className="py-3.5 px-4">ปีงบประมาณ</th>
                                                    <th className="py-3.5 px-4 text-right">Facebook RPRP</th>
                                                    <th className="py-3.5 px-4 text-right">Instagram</th>
                                                    <th className="py-3.5 px-4 text-right">Tiktok</th>
                                                    <th className="py-3.5 px-4 text-right">LINE OA</th>
                                                    <th className="py-3.5 px-4">หมายเหตุ</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-50 text-xs text-gray-700">
                                                {filteredTimelineData
                                                    .filter(row => {
                                                        const matchSearch = row.month.includes(searchTerm) || row.fy.includes(searchTerm) || (row.note && row.note.includes(searchTerm));
                                                        return matchSearch;
                                                    })
                                                    .map((row) => (
                                                        <tr key={row.id} className="hover:bg-rajapruek-greenlight/20 transition-colors">
                                                            <td className="py-3 px-4 font-bold text-gray-900">{row.month}</td>
                                                            <td className="py-3 px-4">
                                                                <span className="bg-rajapruek-greenlight text-rajapruek-green px-2.5 py-0.5 rounded-full font-semibold text-[10px]">
                                                                    ปีงบ {row.fy}
                                                                </span>
                                                            </td>
                                                            <td className="py-3 px-4 text-right font-medium">{row.fb_rprp ? row.fb_rprp.toLocaleString() : "-"}</td>
                                                            <td className="py-3 px-4 text-right font-medium text-pink-700">{row.ig ? row.ig.toLocaleString() : "-"}</td>
                                                            <td className="py-3 px-4 text-right font-medium text-gray-900">{row.tiktok ? row.tiktok.toLocaleString() : "-"}</td>
                                                            <td className="py-3 px-4 text-right font-medium text-emerald-600">{row.line_net ? row.line_net.toLocaleString() : "-"}</td>
                                                            <td className="py-3 px-4">
                                                                {row.note ? (
                                                                    <span className="text-[10px] bg-amber-50 text-amber-800 border border-amber-200/50 px-2 py-0.5 rounded font-medium">
                                                                        {row.note}
                                                                    </span>
                                                                ) : (
                                                                    <span className="text-gray-300">-</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        </section>
                    )}

                    {/* Footer Attribution */}
                    <footer className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 text-center text-xs text-gray-400 space-y-1 w-full">
                        <p>© 2026 อุทยานหลวงราชพฤกษ์. All Rights Reserved.</p>
                        <p>ออกแบบและพัฒนาโมดูลสรุปสถิติเปรียบเทียบอย่างเป็นทางการจากข้อมูลเอกสาร "ข้อมูลสรุปผู้ติดตามและผลการดำเนินงานช่องทางสื่อออนไลน์ของอุทยานหลวงราชพฤกษ์"</p>
                    </footer>

                </div>
            );
        }

        // Initialize React application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Refresh UI state & Re-initialize Lucide Icons
        window.addEventListener('load', () => {
            if(typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
